server:
  port: 8080

spring:
  application:
    name: do-an-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/food_map_db?currentSchema=public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:ngoc04}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key-for-demo-project}
      expiration: ${JWT_EXPIRATION:86400000}
  upload:
    dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
