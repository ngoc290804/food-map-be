server:
  port: 8080

spring:
  application:
    name: do-an-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/food_map_db?currentSchema=public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:ngoc04}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key-for-demo-project}
      expiration: ${JWT_EXPIRATION:86400000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:dmwfkj9y4}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:food-map}
  nominatim:
    base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${NOMINATIM_USER_AGENT:food-map-be/1.0}
    country-codes: ${NOMINATIM_COUNTRY_CODES:vn}
    min-interval-millis: ${NOMINATIM_MIN_INTERVAL_MILLIS:1000}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
